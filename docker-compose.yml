version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MODE=http
      - HTTP_PORT=3000
      - HTTP_HOST=0.0.0.0
      - API_KEYS=${API_KEYS:-}
      # 3.0.1 fail-closed：推荐使用注册表；legacy 模式必须设置 API_KEYS 且 ALLOW_ADHOC_CONNECTIONS=true
      - DATASOURCE_CONFIG=${DATASOURCE_CONFIG:-}
      - ALLOW_ADHOC_CONNECTIONS=${ALLOW_ADHOC_CONNECTIONS:-false}
      - ADHOC_TARGET_ALLOWLIST=${ADHOC_TARGET_ALLOWLIST:-}
      - AUDIT_LOG_PATH=${AUDIT_LOG_PATH:-}
      - AUDIT_REQUIRED=${AUDIT_REQUIRED:-false}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
      - RATE_LIMIT_MAX=${RATE_LIMIT_MAX:-100}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s